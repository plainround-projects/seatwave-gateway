# The Module 11 lab: the gateway in front of the catalog and booking services, the mobile
# backend-for-frontend, and the token issuer stand-in. Run it as Compose project seatwave-gateway.
# Only the gateway (and the issuer, so a learner can ask for a token with curl) publish ports, on
# 127.0.0.1 alone, in Module 11's range 21100 to 21199; the services are reachable only from the
# gateway's network, which is what lets them trust X-SeatWave-Subject.
name: seatwave-gateway

x-program: &program
  restart: "no"
  networks: [lab]

services:
  issuer:
    <<: *program
    build: { context: ., args: { PROGRAM: issuer } }
    environment:
      SEATWAVE_ISSUER_KEY_FILE: /run/secrets/issuer_keys
    secrets: [issuer_keys]
    ports: ["127.0.0.1:21102:8080"]
    deploy: { resources: { limits: { cpus: "1", memory: 512M } } }

  catalog:
    <<: *program
    build: { context: ., args: { PROGRAM: catalog } }
    deploy: { resources: { limits: { cpus: "1", memory: 512M } } }

  booking:
    <<: *program
    build: { context: ., args: { PROGRAM: booking } }
    environment:
      # Lab 3 sets this to 2s to make the booking service slow; 0s injects nothing.
      SEATWAVE_BOOKING_READ_DELAY: ${SEATWAVE_BOOKING_READ_DELAY:-0s}
    deploy: { resources: { limits: { cpus: "1", memory: 512M } } }

  mobile-bff:
    <<: *program
    build: { context: ., args: { PROGRAM: mobile-bff } }
    depends_on: [catalog, booking]
    deploy: { resources: { limits: { cpus: "1", memory: 512M } } }

  gateway:
    <<: *program
    build: { context: ., args: { PROGRAM: gateway } }
    depends_on: [issuer, catalog, booking, mobile-bff]
    ports:
      - "127.0.0.1:21100:8080"
      # Health and metrics, never on the public port.
      - "127.0.0.1:21101:8081"
    deploy: { resources: { limits: { cpus: "2", memory: 1G } } }

networks:
  lab: {}

secrets:
  # Generated by ./gradlew :issuer:keys into build/, which git ignores; never committed.
  issuer_keys:
    file: ./build/keys/issuer-keys.json
